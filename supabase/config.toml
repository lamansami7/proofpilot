project_id = "proofpilot"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 15
[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080"]
minimum_password_length = 8
[auth.email]
enable_signup = true
enable_confirmations = true
# Both handlers verify the token with Auth getUser; legacy gateway verification
# is disabled to support current asymmetric Supabase signing keys.
[functions.proofpilot-ai]
verify_jwt = false
[functions.delete-account]
verify_jwt = false
